name: Daily trial scan

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC every day, before the London open
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scan.py
      - name: Commit new data
        run: |
          git config user.name "riverscan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily scan $(date -u +%F)"
          git push
