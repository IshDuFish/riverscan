name: Test new sources (temporary)
on:
  push:
    branches: [sources]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Check notice links
        run: |
          curl -s -o /dev/null -L -w "%{http_code} %{url_effective}\n" "https://www.find-tender.service.gov.uk/Notice/110351-2026"
          curl -s -o /dev/null -L -w "%{http_code} %{url_effective}\n" "https://clinicaltrials.gov/study/NCT05428969"
          curl -s -o /dev/null -L -w "%{http_code} %{url_effective}\n" "https://www.contractsfinder.service.gov.uk/Notice/0eab381a-8f1f-4c0b-8262-a7bee257cbb7"
      - run: git fetch -q origin main && git checkout origin/main -- data
      - run: python scan.py
      - name: Save test output to this branch
        run: |
          git config user.name "riverscan-bot"; git config user.email "actions@users.noreply.github.com"
          git add data; git diff --cached --quiet || git commit -qm "Test scan output"; git push
