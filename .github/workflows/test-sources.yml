name: Test new sources (temporary)
on:
  push:
    branches: [sources]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python diag_fts.py
      - run: git fetch -q origin main && git checkout origin/main -- data
      - run: python scan.py
      - name: Save test output to this branch
        run: |
          git config user.name "riverscan-bot"; git config user.email "actions@users.noreply.github.com"
          git add data; git diff --cached --quiet || git commit -qm "Test scan output"; git push
