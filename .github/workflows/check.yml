name: check (temporary)
on: {push: {branches: [smallcap]}}
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q
      - run: git fetch -q origin main && git checkout origin/main -- data
      - run: python scan.py
      - run: cat data/fundamentals.json | head -60
