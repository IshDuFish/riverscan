<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal log – Riverscan</title>
<style>
  :root { --ink:#0e1b24; --muted:#5b6b75; --line:#e3e8eb; --bg:#f7f9fa; --river:#1d6f8c;
          --high:#b3261e; --med:#b86e00; --low:#5b6b75; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:48px 20px 24px; max-width:960px; margin:auto; }
  header a { color:var(--river); text-decoration:none; font-weight:600; }
  h1 { font-size:2rem; margin:12px 0 8px; letter-spacing:-0.02em; }
  .lede { color:var(--muted); max-width:620px; line-height:1.5; margin:0; }
  main { max-width:960px; margin:auto; padding:0 20px 60px; }
  .stats { display:flex; gap:12px; flex-wrap:wrap; margin:20px 0; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 16px; min-width:120px; }
  .stat b { display:block; font-size:1.5rem; }
  .stat span { color:var(--muted); font-size:.85rem; }
  .filters { display:flex; gap:8px; margin:16px 0; flex-wrap:wrap; }
  .filters button { border:1px solid var(--line); background:#fff; padding:6px 14px; border-radius:999px; cursor:pointer; font:inherit; }
  .filters button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .sig { background:#fff; border:1px solid var(--line); border-left:4px solid var(--low); border-radius:8px; padding:14px 16px; margin-bottom:10px; }
  .sig.high { border-left-color:var(--high); } .sig.medium { border-left-color:var(--med); }
  .top { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .co { font-weight:700; } .tk { color:var(--muted); font-weight:400; }
  .when { color:var(--muted); font-size:.85rem; font-variant-numeric:tabular-nums; }
  .note { margin:6px 0 2px; }
  .chg { font-family:ui-monospace,Menlo,monospace; font-size:.85rem; color:var(--muted); }
  .trial { font-size:.85rem; color:var(--muted); margin-top:6px; }
  .trial a { color:var(--river); }
  .empty { color:var(--muted); padding:30px 0; }
  footer { color:var(--muted); font-size:.8rem; max-width:960px; margin:auto; padding:0 20px 40px; }
</style>
</head>
<body>
<header>
  <a href="index.html">← Riverscan</a>
  <h1>Signal log</h1>
  <p class="lede">Every change our scanner has spotted in the clinical trials of the London-listed biotechs we track, timestamped when we caught it. Nothing is edited after the fact.</p>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="filters" id="filters">
    <button class="on" data-f="all">All</button>
    <button data-f="high">High</button>
    <button data-f="medium">Medium</button>
    <button data-f="low">Low</button>
  </div>
  <div id="list"><p class="empty">Loading…</p></div>
</main>
<footer>Data from ClinicalTrials.gov, checked daily. For information only, not investment advice.</footer>
<script>
const esc = s => String(s ?? "–").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let all = [], filter = "all";
function render() {
  const rows = all.filter(s => filter === "all" || s.severity === filter);
  document.getElementById("list").innerHTML = rows.length ? rows.map(s => `
    <div class="sig ${s.severity}">
      <div class="top"><div class="co">${esc(s.company)} <span class="tk">${esc(s.ticker)}</span></div>
      <div class="when">${esc(s.detected_at.replace("T"," ").replace("Z"," UTC"))}</div></div>
      <div class="note">${esc(s.note)}</div>
      ${s.type === "change" ? `<div class="chg">${esc(s.old)} → ${esc(s.new)}</div>` : ""}
      <div class="trial">${esc(s.trial)} · <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.nct_id)}</a></div>
    </div>`).join("") : `<p class="empty">No signals logged yet. The scanner runs every morning.</p>`;
}
document.getElementById("filters").onclick = e => {
  if (!e.target.dataset.f) return;
  filter = e.target.dataset.f;
  document.querySelectorAll("#filters button").forEach(b => b.classList.toggle("on", b === e.target));
  render();
};
fetch("data/signals.json", {cache:"no-store"}).then(r => r.json()).then(d => {
  all = d.slice().reverse();
  const cos = new Set(all.map(s => s.ticker)).size;
  const hi = all.filter(s => s.severity === "high").length;
  document.getElementById("stats").innerHTML =
    `<div class="stat"><b>${all.length}</b><span>signals logged</span></div>
     <div class="stat"><b>${hi}</b><span>high severity</span></div>
     <div class="stat"><b>${cos}</b><span>companies with signals</span></div>`;
  render();
}).catch(() => { document.getElementById("list").innerHTML = `<p class="empty">No signals logged yet. The scanner runs every morning.</p>`; });
</script>
</body>
</html>
